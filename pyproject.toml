[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anywidget-instruments"
version = "0.1.0.dev0"
description = "Base of the anywidget-instruments widget libraries: base widget class, trait contract, themes and kernel liveness, built on anywidget."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sébastien Celles" }]
keywords = ["anywidget", "jupyter", "marimo", "instrumentation", "widgets"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Jupyter",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["anywidget>=0.9", "traitlets>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18", "ruff>=0.6", "mypy>=1.10", "marimo"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/AnywidgetInstruments/anywidget-instruments"
Issues = "https://github.com/AnywidgetInstruments/anywidget-instruments/issues"
Documentation = "https://anywidgetinstruments.github.io/anywidget-instruments/"
Specification = "https://anywidgetinstruments.github.io/anywidget-instruments/specification/"

[tool.hatch.build]
only-packages = true
# data directories are not Python packages: only-packages would leave them out
artifacts = ["src/anywidget_instruments/schema/*.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/anywidget_instruments"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
